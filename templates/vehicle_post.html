{% extends "base.html" %}
{% block title %}ثبت آگهی وسیله نقلیه | {{ site_name }}{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/kharidino-vehicles.css', v='2026-09-25-1') }}">{% endblock %}
{% block content %}<section class="vehicle-form-page"><div class="vehicle-form-head"><span>بازار خرید و فروش خریدینو</span><h1>ثبت آگهی وسیله نقلیه</h1><p>آگهی پس از بررسی مدیریت منتشر می‌شود.</p></div><form method="post" enctype="multipart/form-data" class="vehicle-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="vehicle-form-section"><h2>اطلاعات اصلی</h2><div class="vehicle-fields">
<label>عنوان آگهی *<input name="title" required placeholder="مثلاً پژو 207 اتوماتیک مدل 1401"></label><label>دسته *<select name="category" required>{% for c in vehicle_categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select></label><label>شهر *<input name="city" required placeholder="تهران"></label><label>محله<input name="district"></label><label>قیمت (تومان)<input type="number" name="price" min="0"></label><label class="check"><input type="checkbox" name="negotiable" value="1"> قیمت قابل مذاکره</label><label>برند<input name="brand"></label><label>مدل<input name="model"></label><label>سال ساخت<input type="number" name="year" min="0"></label><label>کارکرد (کیلومتر)<input type="number" name="mileage" min="0"></label><label>سوخت<select name="fuel"><option value="">انتخاب</option><option>بنزین</option><option>گاز</option><option>دوگانه‌سوز</option><option>دیزل</option><option>برقی</option><option>هیبریدی</option></select></label><label>گیربکس<select name="gearbox"><option value="">انتخاب</option><option>دستی</option><option>اتوماتیک</option><option>نیمه‌اتوماتیک</option></select></label><label>رنگ بدنه<input name="body_color"></label><label>وضعیت موتور<input name="engine"></label><label>وضعیت بدنه/تصادف<input name="accident_status" placeholder="بدون تصادف، رنگ‌شدگی..."></label><label>نوع فروشنده<select name="seller_type"><option>شخصی</option><option>نمایشگاه</option></select></label><label>شماره تماس *<input name="phone" required placeholder="09xxxxxxxxx"></label></div></div><div class="vehicle-form-section"><h2>توضیحات و تصاویر</h2><label>توضیحات<textarea name="description" rows="7"></textarea></label><label>تصاویر (حداکثر ۸ عکس)<input type="file" name="images" accept="image/png,image/jpeg,image/webp,image/gif" multiple></label></div><button class="vehicle-primary vehicle-submit" type="submit">ثبت آگهی <i class="fa-solid fa-arrow-left"></i></button></form></section>{% endblock %}
