name: Kharidino quality check

on:
  push:
    branches:
      - feature/kharidino-premium-design-system-2026-09-26
  pull_request:

jobs:
  syntax-and-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install template checker
        run: python -m pip install --disable-pip-version-check Jinja2
      - name: Compile Python
        run: python -m py_compile app.py
      - name: Parse Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          root = Path("templates")
          env = Environment(loader=FileSystemLoader(str(root)))
          files = sorted(root.rglob("*.html"))
          if not files:
              raise SystemExit("No HTML templates found")
          for path in files:
              env.parse(path.read_text(encoding="utf-8"))
              print("JINJA OK:", path)
          PY
