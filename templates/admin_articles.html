{% extends "base.html" %}
{% block content %}<section class="container py-4"><h1>مدیریت مجله</h1><form method="post" class="glass-card p-3 mb-4"><input name="title" class="form-control mb-2" maxlength="240" required placeholder="عنوان"><input name="slug" class="form-control mb-2" maxlength="140" placeholder="slug اختیاری"><select name="category_id" class="form-select mb-2"><option value="">بدون دسته</option>{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select><input name="excerpt" class="form-control mb-2" maxlength="500" placeholder="خلاصه"><textarea name="body" class="form-control mb-2" rows="8" required placeholder="متن مقاله"></textarea><button class="btn btn-primary">انتشار مقاله</button></form><form method="post" action="{{ url_for('admin_article_category') }}" class="glass-card p-3 mb-4"><input name="name" class="form-control mb-2" required placeholder="دسته جدید"><button class="btn btn-outline-primary">افزودن دسته</button></form>{% for a in articles %}<div class="card p-3 mb-2"><strong>{{ a.title }}</strong><span class="text-muted">/{{ a.slug }}</span></div>{% else %}<p>مقاله‌ای وجود ندارد.</p>{% endfor %}</section>{% endblock %}
