{% extends "base.html" %}

{% block title %}ورود | {{ site_name }}{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon"><i class="fa-solid fa-user-lock"></i></div>
            <h1>ورود به خریدینو</h1>
            <p>برای ادامه وارد حساب کاربری خود شوید.</p>
        </div>

        <form method="POST" class="auth-form">
            <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
            <div class="form-group">
                <label for="email">ایمیل</label>
                <input id="email" name="email" type="email" autocomplete="email" required value="{{ request.form.get('email', '') }}">
            </div>
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">ورود</button>
        </form>

        <div class="auth-links">
            <span>حساب کاربری ندارید؟</span>
            <a href="{{ url_for('register') }}">ثبت‌نام</a>
        </div>

        <div class="auth-seller-cta">
            <strong>صاحب فروشگاه هستی؟</strong>
            <a href="/seller/register">ثبت فروشگاه در خریدینو</a>
        </div>
    </div>
</div>
{% endblock %}
