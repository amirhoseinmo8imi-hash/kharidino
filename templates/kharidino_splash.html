<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050816"><title>خریدینو</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816;color:#fff;font-family:Tahoma,Arial,sans-serif}.splash{height:100%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 45%,rgba(99,102,241,.2),transparent 35%),#050816}.orb{position:absolute;width:320px;height:320px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);filter:blur(70px);opacity:.25;animation:orb 5s ease-in-out infinite alternate}.brand{position:relative;text-align:center;animation:in 1.1s ease both}.logo{width:105px;height:105px;margin:auto;border-radius:30px;display:grid;place-items:center;font-size:52px;font-weight:900;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 0 70px rgba(99,102,241,.45)}h1{font-size:48px;letter-spacing:2px;margin:22px 0 8px}.tag{color:#a5b4fc;font-size:16px}.enter{margin-top:28px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;border-radius:14px;padding:12px 26px;cursor:pointer;font-size:14px}.skip{position:fixed;left:18px;bottom:18px;color:#94a3b8;background:none;border:0;cursor:pointer}@keyframes in{from{opacity:0;transform:scale(.88) translateY(20px)}to{opacity:1;transform:none}}@keyframes orb{to{transform:translate(50px,-30px) scale(1.15)}}@media(max-width:600px){h1{font-size:38px}.logo{width:88px;height:88px;font-size:42px}}</style></head><body><main class="splash"><div class="orb"></div><div class="brand"><div class="logo">خ</div><h1>KHARIDINO</h1><div class="tag">مقایسه کن، بهتر بخر</div><button class="enter" onclick="go()">ورود به خریدینو</button></div><button class="skip" onclick="go()">رد کردن</button></main><script>function go(){document.cookie='kharidino_splash=1; Max-Age=2592000; Path=/; SameSite=Lax';location.href='/'}setTimeout(go,2600);</script></body></html>
