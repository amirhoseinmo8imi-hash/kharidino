name: Kharidino Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile_app/android/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kharidino-debug-apk
          path: mobile_app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-release:
    if: github.event_name == 'workflow_dispatch' && vars.KHARIDINO_BASE_URL != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Release APK
        run: gradle assembleRelease -PkharidinoBaseUrl="${{ vars.KHARIDINO_BASE_URL }}"
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kharidino-release-apk
          path: mobile_app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
