{% extends "base.html" %}
{% block content %}<section class="container py-4"><h1>مدیریت بنرها</h1><form method="post" class="glass-card p-3 mb-4"><input name="title" class="form-control mb-2" maxlength="160" placeholder="عنوان"><select name="position" class="form-select mb-2"><option value="home">صفحه اصلی</option><option value="category">دسته‌بندی</option><option value="product">محصول</option><option value="campaign">کمپین</option></select><input name="image" class="form-control mb-2" maxlength="500" required placeholder="مسیر تصویر مثل uploads/banners/banner.jpg"><input name="target_url" class="form-control mb-2" maxlength="700" placeholder="لینک مقصد (اختیاری)"><button class="btn btn-primary">ذخیره بنر</button></form>{% for b in banners %}<div class="card p-3 mb-2 d-flex flex-row justify-content-between"><span>{{ b.title }} — {{ b.position }} — {{ 'فعال' if b.active else 'غیرفعال' }}</span><form method="post" action="{{ url_for('toggle_banner', banner_id=b.id) }}"><button class="btn btn-sm btn-outline-secondary">تغییر وضعیت</button></form></div>{% else %}<p>بنری ثبت نشده.</p>{% endfor %}</section>{% endblock %}
