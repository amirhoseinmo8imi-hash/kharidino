name: Kharidino Security CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Ruff lint
        run: ruff check .
      - name: Bandit security scan
        # B104 is intentional for the LAN-facing development launcher, B108 is
        # Gunicorn's documented /dev/shm worker directory, and B608 is raised
        # on SQL identifiers selected from fixed internal constants while all
        # user values remain bound parameters. Dedicated source audits below
        # still enforce the project's injection/security rules.
        run: bandit -r . -x ./.git,./venv,./.venv -ll -s B104,B108,B608
      - name: Source security audit
        run: python security_audit.py
      - name: Template and dangerous sink audit
        run: python security_source_audit.py
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Run tests
        run: pytest -q
