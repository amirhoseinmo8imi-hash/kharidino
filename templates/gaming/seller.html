{% extends "base.html" %}{% block title %}فروشنده گیمینگ | خریدینو{% endblock %}{% block extra_css %}<link rel="stylesheet" href="{{url_for('static',filename='css/kharidino-gaming.css',v='2026-10-04-3')}}">{% endblock %}{% block content %}<div class="gaming-page"><div class="gaming-panel"><span class="eyebrow dark">GAMING SELLER CENTER</span><h1>مرکز فروشنده</h1><form class="gaming-form" method="post" action="{{url_for('gaming_seller_profile')}}"><input name="store_name" value="{{profile.store_name if profile else ''}}" placeholder="نام فروشگاه/برند"><textarea name="bio" placeholder="معرفی فروشگاه">{{profile.bio if profile else ''}}</textarea><button class="gaming-btn primary">ذخیره پروفایل</button></form></div><div class="market-grid">{% for m in listings %}<article class="gaming-panel"><b>{{m.product.name}}</b><span>{{m.platform}} · {{m.item_type}}</span><strong>{{m.status}}</strong></article>{% endfor %}</div></div>{% endblock %}
