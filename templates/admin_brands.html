{% extends "base.html" %}
{% block content %}<section class="container py-4"><h1>مدیریت برندها</h1><form method="post" class="glass-card p-3 mb-4"><input name="name" class="form-control mb-2" maxlength="120" required placeholder="نام برند"><input name="slug" class="form-control mb-2" maxlength="140" placeholder="شناسه انگلیسی (اختیاری)"><button class="btn btn-primary">افزودن برند</button></form><div class="list-group">{% for b in brands %}<div class="list-group-item d-flex justify-content-between align-items-center"><span>{{ b.name }} <small class="text-muted">{{ b.slug }}</small></span><form method="post" action="{{ url_for('toggle_brand', brand_id=b.id) }}"><button class="btn btn-sm btn-outline-secondary">{{ 'فعال' if b.active else 'غیرفعال' }}</button></form></div>{% else %}<div>برندی ثبت نشده.</div>{% endfor %}</div></section>{% endblock %}
